    {"@type":"Question","name":"Do I have to be an accredited investor?","acceptedAnswer":{"@type":"Answer","text":"For most of our offerings, yes. Broadly, that means $200,000 of individual income (or $300,000 jointly) in each of the last two years with a reasonable expectation of the same this year, or a net worth over $1 million excluding your primary residence. Certain professional licences such as Series 7, 65 or 82 also qualify. We verify accreditation before you can subscribe."}},
    {"@type":"Question","name":"How long is my money committed in a multifamily syndication?","acceptedAnswer":{"@type":"Answer","text":"Plan on the full holding period stated in the offering documents. There is no redemption window and no secondary market, so the capital should be money you will not need for anything else. If you might need it sooner, a publicly traded REIT is a better instrument."}},
    {"@type":"Question","name":"What is a preferred return?","acceptedAnswer":{"@type":"Answer","text":"The preferred return is an annual return that limited partners receive on their invested capital before the sponsor participates in any profits. If cash flow in a period does not cover it, the shortfall normally accrues and must be paid before the sponsor takes a profit share. It is a priority in the payment order, not a guarantee of payment."}},
    {"@type":"Question","name":"Can I invest through a self-directed IRA or solo 401(k)?","acceptedAnswer":{"@type":"Answer","text":"Yes. Self-directed IRAs, solo 401(k)s, trusts and LLCs are all common ways to invest. Be aware that debt-financed income inside a retirement account can trigger unrelated business income tax (UBIT), so speak with your CPA before you subscribe rather than after."}},
    {"@type":"Question","name":"What is the difference between a REIT and a real estate syndication?","acceptedAnswer":{"@type":"Answer","text":"A public REIT is a liquid security that trades with the stock market and distributes dividends taxed as ordinary income, with no depreciation passed through to you. A syndication is direct ownership of a specific property through a partnership: illiquid, uncorrelated to public equities, and depreciation flows through to you on a Schedule K-1."}},
    {"@type":"Question","name":"What is a Schedule K-1 and when will I receive it?","acceptedAnswer":{"@type":"Answer","text":"A K-1 is the tax form a partnership issues reporting your share of its income, losses and deductions for the year. Because real estate is depreciated, a K-1 in the early years of a value-add deal often reports a loss even in a year you received cash distributions. Partnerships also file in the state the property sits in, so you may have a non-resident state filing."}},
    {"@type":"Question","name":"What happens if the property underperforms?","acceptedAnswer":{"@type":"Answer","text":"Distributions are reduced or paused first, which is why the preferred return accrues rather than disappearing. In a more severe case the partnership could require additional capital from partners, or lose the property to the lender, in which case investors can lose their entire investment. Every offering states these scenarios explicitly."}}
